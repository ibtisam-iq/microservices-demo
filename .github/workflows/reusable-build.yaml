# =============================================================================
# Reusable Worker: Build · Scan · Push
# Called by: ci-trigger.yaml (matrix, one invocation per changed service)
#
# Responsibilities:
#   1. Trivy filesystem scan: catch secrets/misconfigs in source BEFORE build
#   2. Docker build: BuildKit cache via the GHA cache backend
#   3. Trivy image scan: security gate on the built image
#   4. Push to GHCR: conditional on the push_image input (skipped on PR)
#
# Image Updater integration:
#   After images land in GHCR, ArgoCD Image Updater detects new digests and
#   updates the running deployments. CI does not touch the CD repo. The three
#   tags pushed here serve different consumers:
#     :sha-<40char>  -- immutable audit trail, traceable to exact commit
#     :sha-<7char>   -- human-readable, visible in ArgoCD UI and CD logs
#     :latest        -- Image Updater tracks this tag's digest for updates
#
# Security posture:
#   - FS scan: advisory, exit-code 0. Catches low hanging secrets early.
#   - Image scan OS packages: exit-code 0. Vendor's responsibility, warn only.
#   - Image scan library CRITICAL: DESIGNED as a hard gate (exit-code 1).
#     Currently set to exit-code 0 as a deliberate, temporary relaxation
#     because the upstream Online Boutique base images carry known CRITICAL
#     CVEs that would block every build during the pipeline build out phase.
#     RESTORE exit-code "1" once base images are patched or a curated
#     .trivyignore is in place. Until then this pass is advisory in effect.
#   - Image scan library HIGH/MEDIUM: exit-code 0, warn and upload report.
#   The three way severity split exists precisely so the CRITICAL library pass
#   can become the gate independently of OS package noise.
#
# Action pinning: actions/checkout is SHA pinned. The remaining actions
#   (trivy-action, buildx, login, build-push, upload-artifact) are pinned to
#   semver tags, NOT commit SHAs. Converting them to SHA pins is tracked as
#   follow up work (see runbook Phase 5 and Phase 10.3).
#
# BuildKit cache strategy:
#   cache-from: type=gha restores layers across runs for the same scope.
#   cache-to: type=gha,mode=max writes ALL layers, not just the final stage.
#   This is correct for multi-stage Dockerfiles (builder + runtime stages).
#   mode=max is intentional: saves runner time at the cost of cache storage.
#
# load vs push:
#   load: true puts the image in the local Docker daemon for the Trivy image
#   scan. load: true is INCOMPATIBLE with multi platform builds. These
#   services are linux/amd64 only in CI. If multi-arch is added, split into
#   build, scan, push as three separate steps and remove load: true.
#
# cartservice anomaly:
#   docker_context is passed by the caller (ci-trigger.yaml). cartservice
#   Dockerfile lives in src/cartservice/src/, not src/cartservice/. The
#   reusable worker stays generic; the caller owns the context routing logic.
#
# Short SHA note:
#   GitHub Actions expression syntax does not support string slicing ([0:7]).
#   IMAGE_SHORT is computed in a dedicated bash step (Stage 0) using the
#   shell substring ${GITHUB_SHA:0:7} and exported via GITHUB_ENV so all
#   subsequent steps can reference it as ${{ env.IMAGE_SHORT }}.
# =============================================================================

name: Reusable - Build · Scan · Push

on:
  workflow_call:
    inputs:
      service:
        description: 'Service directory name under src/ (e.g. frontend, cartservice)'
        required: true
        type: string
      docker_context:
        description: 'Docker build context path (relative to repo root)'
        required: true
        type: string
      push_image:
        description: 'Push image to GHCR after scan. Set false on PR builds.'
        required: false
        type: boolean
        default: true

jobs:

  build-scan-push:
    name: ${{ inputs.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read          # checkout
      packages: write         # push to GHCR
      security-events: write  # upload Trivy SARIF reports to the GitHub Security tab

    env:
      # Canonical image references used across all steps in this job.
      # IMAGE_REF:    full 40-char SHA tag, immutable, audit trail.
      # IMAGE_LATEST: mutable tag tracked by ArgoCD Image Updater.
      # IMAGE_SHORT:  7-char short SHA, computed in Stage 0 via bash and
      #               exported to GITHUB_ENV. Human-readable in ArgoCD UI.
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:sha-${{ github.sha }}
      IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:latest

    steps:

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 0: Compute short SHA
      # GHA expressions do not support string slicing. Use bash substring
      # syntax ${GITHUB_SHA:0:7} and write to GITHUB_ENV so all later steps
      # can reference it as ${{ env.IMAGE_SHORT }}.
      # ────────────────────────────────────────────────────────────────────────
      - name: Compute short SHA
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "IMAGE_SHORT=ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 1: Checkout
      # fetch-depth: 1 (default) is sufficient here; no git history needed in
      # the worker. SonarQube blame requires depth 0; add it if Sonar is ever
      # enabled per service.
      # ────────────────────────────────────────────────────────────────────────
      - name: Checkout - source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 2: Trivy Filesystem Scan
      # Scan the source tree BEFORE building the image. Catches hardcoded
      # secrets, IaC misconfigs in Dockerfiles, and declared dependency CVEs
      # early. Two passes:
      #   Pass A: CRITICAL, advisory.
      #   Pass B: HIGH/MEDIUM, advisory, upload JSON artifact for audit trail.
      # The image scan (Stage 6) is where the gate lives, not here.
      # ────────────────────────────────────────────────────────────────────────
      - name: Trivy - filesystem scan CRITICAL (advisory)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.docker_context }}
          scanners: secret,vuln,misconfig
          severity: CRITICAL
          exit-code: "0"
          format: table

      - name: Trivy - filesystem scan HIGH/MEDIUM (advisory, upload report)
        uses: aquasecurity/trivy-action@v0.24.0
        if: always()
        with:
          scan-type: fs
          scan-ref: ${{ inputs.docker_context }}
          scanners: secret,vuln,misconfig
          severity: HIGH,MEDIUM
          exit-code: "0"
          format: json
          output: trivy-fs-${{ inputs.service }}.json

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v4.6.0
        if: always() && hashFiles(format('trivy-fs-{0}.json', inputs.service)) != ''
        with:
          name: trivy-fs-${{ inputs.service }}
          path: trivy-fs-${{ inputs.service }}.json
          retention-days: 14

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 3: Docker Buildx Setup
      # Buildx is required for the BuildKit cache backend (type=gha).
      # Standard docker build does not support --cache-from type=gha.
      # ────────────────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 4: GHCR Login
      # Login is NOT gated to push_image=true. The GHA cache backend
      # (cache-from) may need authenticated pulls from GHCR to restore
      # cached layers from previous runs. Login must precede the build step.
      # ────────────────────────────────────────────────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 5: Docker Build
      # load: true loads the image into the local daemon for the Trivy image
      # scan. push: false because push is a separate stage after the scan
      # stages run. OCI labels follow the opencontainers image spec for
      # traceability. head_commit.timestamp is null on workflow_dispatch, so
      # fall back to run_started_at.
      # All three tags (full SHA, short SHA, latest) are applied at build time
      # so all three are available in the local daemon for scan and push.
      # IMAGE_SHORT is available here because Stage 0 already wrote it to
      # GITHUB_ENV before this step runs.
      # ────────────────────────────────────────────────────────────────────────
      - name: Docker Build - load into daemon (scan before push)
        uses: docker/build-push-action@v6.15.0
        with:
          context: ${{ inputs.docker_context }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.IMAGE_SHORT }}
            ${{ env.IMAGE_LATEST }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.run_started_at }}
            org.opencontainers.image.title=${{ inputs.service }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 6: Trivy Image Scan
      # Three passes:
      #   Pass A: OS packages CRITICAL/HIGH, advisory (base image vendor's job).
      #   Pass B: library CRITICAL. DESIGNED as the hard gate (exit-code 1).
      #           Currently exit-code 0, a deliberate temporary relaxation
      #           (see the header block). Restore "1" to enforce the gate.
      #   Pass C: library HIGH/MEDIUM, advisory, upload JSON artifact.
      # ────────────────────────────────────────────────────────────────────────
      - name: Trivy - image scan OS packages (advisory)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          vuln-type: os
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      # exit-code is "0" today (gate temporarily relaxed). Set to "1" to make
      # any CRITICAL library CVE fail the build. See header block for rationale.
      - name: Trivy - image scan library CRITICAL (gate, currently advisory)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          vuln-type: library
          severity: CRITICAL
          exit-code: "0"
          format: table

      - name: Trivy - image scan library HIGH/MEDIUM (advisory, upload report)
        uses: aquasecurity/trivy-action@v0.24.0
        if: always()
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          vuln-type: library
          severity: HIGH,MEDIUM
          exit-code: "0"
          format: json
          output: trivy-image-${{ inputs.service }}.json

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4.6.0
        if: always() && hashFiles(format('trivy-image-{0}.json', inputs.service)) != ''
        with:
          name: trivy-image-${{ inputs.service }}
          path: trivy-image-${{ inputs.service }}.json
          retention-days: 14

      # ────────────────────────────────────────────────────────────────────────
      # STAGE 7: Push to GHCR
      # All three tags are pushed. After landing in GHCR, ArgoCD Image Updater
      # detects the new digest behind :latest and rolls the deployment.
      # CI's job ends here; no CD repo write needed.
      # ────────────────────────────────────────────────────────────────────────
      - name: Push to GHCR - SHA + short SHA + latest tags
        if: inputs.push_image == true
        run: |
          docker push ${{ env.IMAGE_REF }}
          docker push ${{ env.IMAGE_SHORT }}
          docker push ${{ env.IMAGE_LATEST }}

      # ────────────────────────────────────────────────────────────────────────
      # Cleanup: evict images from the runner's local daemon.
      # Runners are ephemeral but image layers consume disk; large services
      # (adservice JVM, frontend Node build) can hit the runner disk limit in
      # matrix runs sharing the same runner pool.
      # ────────────────────────────────────────────────────────────────────────
      - name: Cleanup - remove local Docker images
        if: always()
        run: |
          docker rmi ${{ env.IMAGE_REF }}   || true
          docker rmi ${{ env.IMAGE_SHORT }}  || true
          docker rmi ${{ env.IMAGE_LATEST }} || true
