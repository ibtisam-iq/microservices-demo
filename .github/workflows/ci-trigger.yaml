# =============================================================================
# DevSecOps CI: Microservices Trigger
# Repo:    github.com/ibtisam-iq/microservices-demo
# Pattern: Monorepo matrix dispatch. Detect changed services, fan out per
#          service to reusable workers via workflow_call.
#
# Scope:
#   This workflow owns container images only: build, scan, push to GHCR.
#   It does NOT touch the CD repo (platform-engineering-systems).
#   ArgoCD Image Updater watches GHCR and handles deployment of new images.
#   Chart releases (packaging, publishing, CD repo version bumps) are owned
#   by chart-release.yaml, which triggers independently on helm-chart/ changes.
#
# Design decisions:
#   - paths: src/** ensures doc/infra/chart changes never burn CI minutes.
#   - fetch-depth: 0 is mandatory; shallow clones break the git diff range.
#   - ${{ github.event.before }} is empty on workflow_dispatch and is the all
#     zeros SHA on the first push to a new branch. The fallback to HEAD~1
#     handles both cases so the matrix never emits an empty array by accident.
#   - jq produces a compact JSON array consumed by fromJson() in the matrix.
#   - fail-fast: false. A broken adservice must not abort a clean frontend
#     build. Each service owns its own blast radius.
#   - loadgenerator is intentionally excluded from the matrix; it is a test
#     harness, not a production service, and carries no security gate.
#
# Secrets:
#   secrets: inherit forwards GITHUB_TOKEN to the build worker for GHCR push.
#   GIT_TOKEN is no longer needed here; the CD repo is not touched.
#
# Permissions (top level = ceiling for every reusable workflow this calls):
#   A called reusable workflow can only request permissions at or below what
#   is granted here. It can narrow, never escalate. reusable-build.yaml needs
#   packages: write (GHCR push) and security-events: write (Trivy SARIF), so
#   both must be granted at this level or the run fails at startup. See the
#   runbook, Phase 7 Bug 3 for the startup failure this caused.
# =============================================================================

name: DevSecOps CI - Microservices

on:
  push:
    branches: [main]
    paths:
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/**"   # workflow changes must be validated on PR
  workflow_dispatch:             # manual trigger for re-runs without a dummy commit

# Cancel in-progress runs on the same branch.
# Safe on PR (no registry side effects); dangerous on a main push mid push phase.
# Scope cancel-in-progress to PR only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read           # checkout
  packages: write          # GHCR push (delegated to reusable-build.yaml)
  security-events: write   # Trivy SARIF upload (delegated to reusable-build.yaml)

env:
  # Registry namespace. All service images live under this prefix.
  # Format: ghcr.io/<owner>/microservices-demo/<service>:<tag>
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/microservices-demo

jobs:

  # ============================================================================
  # JOB 1: detect-changes
  # Emit a JSON array of service directory names whose source changed in this
  # push. Downstream matrix reads this array; an empty array short circuits
  # the build via the has_changes flag.
  # ============================================================================
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.changed.outputs.services }}
      has_changes: ${{ steps.changed.outputs.has_changes }}

    steps:
      - name: Checkout - full history required for git diff range
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changed
        run: |
          # Resolve the diff base. github.event.before is empty on
          # workflow_dispatch and all zeros on first push to a new branch.
          # Both fall back to HEAD~1 so the git diff range is always valid.
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="HEAD~1"
          fi

          # Extract unique top level service names from src/ that changed.
          # Exclude loadgenerator; it is a test harness, not a shippable service.
          SERVICES=$(git diff --name-only "${BEFORE}" "${{ github.sha }}" | grep '^src/' | cut -d'/' -f2 | sort -u | grep -v '^loadgenerator$' | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "Detected services: ${SERVICES}"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

          # Emit a boolean flag so downstream if: conditions read cleanly.
          if [[ "${SERVICES}" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # JOB 2: build-and-push
  # Fan out one parallel job per changed service via the matrix strategy.
  # Each job calls the reusable build worker which owns build, scan, and push.
  #
  # After images land in GHCR, ArgoCD Image Updater detects the new digests
  # and updates the running deployments. No CD repo write needed from CI.
  # ============================================================================
  build-and-push:
    name: Build · Scan · Push - ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'

    strategy:
      fail-fast: false   # service failures are independent; never abort siblings
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    uses: ./.github/workflows/reusable-build.yaml
    with:
      service: ${{ matrix.service }}
      # cartservice Dockerfile lives in src/cartservice/src/; every other
      # service uses src/<service>/ directly. Pass the context override so the
      # reusable worker does not need repo specific knowledge baked in.
      docker_context: ${{ matrix.service == 'cartservice' && 'src/cartservice/src' || format('src/{0}', matrix.service) }}
    secrets: inherit   # forward GITHUB_TOKEN to the worker for GHCR push
